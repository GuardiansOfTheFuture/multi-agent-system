server:
  port: 8081

spring:
  application:
    name: paper-ai-backend
  profiles:
    active: local

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # ===== Spring Cache (Redisson 自动配置) =====
  cache:
    type: redis
    redis:
      time-to-live: 15m

# ===== MyBatis-Plus =====
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.paperai.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

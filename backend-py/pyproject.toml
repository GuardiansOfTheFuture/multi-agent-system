[project]
name = "paper-ai-backend"
version = "1.0.0"
description = "PaperAI Multi-Agent 论文写作协作系统 - Python 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiomysql>=0.1.0",
    "alembic>=1.12.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "openai>=1.0.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-docx>=1.0.0",
    "reportlab>=4.0.0",
    "PyPDF2>=3.0.0",
    "markdown-it-py>=3.0.0",
    "sse-starlette>=1.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "httpx>=0.24.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
